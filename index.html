<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW GAME</title>
    <style>
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: #0b0d10; color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      /* ---------- brand ---------- */
      #brand {
        text-align: center; padding: 8px 10px;
        background: #0e1116; border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px; height: 28px; margin-right: 8px;
        border-radius: 50%; vertical-align: middle;
      }
      #brand b {
        font-size: 15px; font-weight: 700; letter-spacing: .14em;
        color: #e6ebf2; vertical-align: middle;
      }

      /* ---------- landing / firmware bar ---------- */
      #fwbar { padding: 12px 18px 10px; }
      #fwstate { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
      #det { font-size: 13px; color: #8b95a3; margin: 0 0 4px; }
      #det b { color: #c8ced8; font-weight: 600; }
      #cache { font-size: 12px; color: #5c6672; min-height: 14px; margin: 0; }
      #cache.cacheok { color: #7fd0a0; }

      /* ---------- progress bar ---------- */
      #progwrap {
        margin: 10px 18px 0;
        height: 10px;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        overflow: hidden;
        display: none;
      }
      #progwrap.on { display: block; }
      #prog {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2f6f52, #7fd0a0);
        transition: width .25s ease-out;
      }
      #progwrap.fail #prog {
        background: linear-gradient(90deg, #6f2f2f, #d08a7f);
      }
      #progwrap.done #prog {
        background: linear-gradient(90deg, #2f6f52, #7fd0a0);
      }
      #proglabel {
        margin: 6px 18px 0;
        font-size: 12px;
        color: #8b95a3;
        text-align: right;
        display: none;
      }
      #proglabel.on { display: block; }

      /* ---------- jb.js running UI (unchanged) ---------- */
      #spin {
        position: fixed; top: calc(50% + 20px); left: 50%;
        width: 46px; height: 46px; margin: -23px 0 0 -23px;
        border: 4px solid #1e2732; border-top-color: #7fd0a0;
        border-radius: 50%; animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg {
        position: fixed; top: 50%; left: 0; right: 0;
        transform: translateY(-50%); text-align: center;
        font-size: 22px; font-weight: 700;
        letter-spacing: .5px; display: none;
      }
      #msg.done {
        color: #7fd0a0;
        font-size: 44px;
        letter-spacing: .18em;
      }
      #msg.fail {
        color: #d08a7f;
        font-size: 24px;
        letter-spacing: .04em;
        padding: 0 24px;
      }
      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin { display: none; }
      body.done #msg  { display: block; }
      body.fail #spin { display: none; }
      body.fail #msg  { display: block; }

      body.log #spin, body.log #msg { display: none; }
      body.log #wrap { padding: 14px 18px; }
      body.log #state {
        display: block; font-size: 22px; font-weight: 700; margin: 0 0 8px;
      }
      body.log #out {
        display: block; white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: #11151b; border: 1px solid #1e2732; border-radius: 5px;
        padding: 10px 12px; height: calc(100vh - 230px); overflow-y: auto;
      }

      /* ---------- shared status colors ---------- */
      .ok   { color: #7fd0a0; }
      .bad  { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand"><b>RAW GAME</b></div>

    <!-- landing / firmware detection (jb.js does not see these IDs) -->
    <div id="fwbar">
      <div id="fwstate">detecting firmware...</div>
      <div id="det"></div>
      <div id="cache"></div>
    </div>

    <!-- progress bar (shown once jb.js starts) -->
    <div id="progwrap"><div id="prog"></div></div>
    <div id="proglabel"></div>

    <!-- jb.js owns everything below: #spin, #msg, #wrap > #state + #out -->
    <div id="spin"></div>
    <div id="msg"></div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      (function () {
        "use strict";

        var fwStateEl = document.getElementById("fwstate");
        var detEl     = document.getElementById("det");
        var cacheEl   = document.getElementById("cache");
        var progWrap  = document.getElementById("progwrap");
        var progEl    = document.getElementById("prog");
        var progLabel = document.getElementById("proglabel");
        var msgEl     = document.getElementById("msg");

        function setFw(t, c)    { fwStateEl.textContent = t; fwStateEl.className = c || ""; }
        function setDet(html)   { detEl.innerHTML = html; }
        function setCache(t, ok){ cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

        var params = new URLSearchParams(location.search);

        // KEEP IN SYNC with ps4_offsets.js.
        // PS4 reports its minor as two hex digits in the UA (13.52 -> 0x52).
        var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // measured on hardware

        var key = null, fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = "0" + ms;
          key   = m[1] + "." + ms;
          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }

        var supported = (fwnum !== null && SUPPORTED[fwnum] === 1);

        setDet("firmware <b>" + (key || "unknown") + "</b>" +
               (supported ? " &middot; <b>supported</b>"
                          : " &middot; not in this build's kernel table"));

        // ---- hard dead end on unsupported firmware ----
        if (!supported) {
          setFw("UNSUPPORTED FIRMWARE", "bad");
          return;
        }

        // ============================================================
        //  progress bar
        // ============================================================
        // Milestone map. jb.js dispatches a "jbmark" CustomEvent from
        // mark(tag, detail) and a "jbdone" CustomEvent right after
        // payloadRunning = plDone. We map the tags it emits to a
        // monotonic percentage. Unknown tags are ignored.
        var PCT = {
          "PRIMITIVE-OK":                       10,
          "BASES":                              15,
          "STUBS":                              20,
          "PROOF-OK":                           25,
          "pr-two-workers-reach-kernel":        30,
          "MAIN-PINNED":                        35,
          "PIN-SPLIT":                          35,
          "PR-PASSA":                           45,
          "PR-PASSB":                           55,
          "ANCHOR-VERDICT":                     65,
          "KF-UNHIDE-LANDED":                   70,
          "KRW-VERDICT":                        80,
          "JB-ROOT-AND-ESCAPE":                 88,
          "KERNEL-PATCHED":                     94,
          "PAYLOAD-RUN":                        99
        };
        var currentPct = 0;
        function bump(tag) {
          var p = PCT[tag];
          if (p === undefined) return;
          if (p <= currentPct) return;
          currentPct = p;
          progEl.style.width = p + "%";
          progLabel.textContent = p + "%";
        }
        function showProg() {
          progWrap.classList.add("on");
          progLabel.classList.add("on");
        }
        function finishProg(ok) {
          progWrap.classList.add("on");
          progLabel.classList.add("on");
          currentPct = 100;
          progEl.style.width = "100%";
          progLabel.textContent = "100%";
          progWrap.classList.remove("done", "fail");
          progWrap.classList.add(ok ? "done" : "fail");
        }

        // ============================================================
        //  jb.js loading
        // ============================================================
        var jbLoaded = false;
        function loadJb() {
          if (jbLoaded) return;
          jbLoaded = true;
          setFw("running jailbreak...", "warn");
          showProg();

          window.addEventListener("jbmark", function (e) {
            try { bump(e && e.detail && e.detail.tag); } catch (_) {}
          }, false);
          window.addEventListener("jbdone", function () {
            finishProg(true);
            setFw("done", "ok");
            msgEl.className = "done";
            msgEl.textContent = "DONE";
            document.body.className = "done";
          }, false);

          var s = document.createElement("script");
          s.type = "module";
          s.src  = "jb.js?v=10";
          document.body.appendChild(s);
        }

        // Watch body.className for jb.js's finishUI() fail path.
        var bodyObserver = new MutationObserver(function () {
          if (document.body.className.indexOf("done") >= 0) return;
          if (document.body.className.indexOf("fail") >= 0) {
            finishProg(false);
            setFw("failed", "bad");
            msgEl.className = "fail";
            msgEl.textContent = "REBOOT YOUR CONSOLE AND TRY AGAIN";
          }
        });
        bodyObserver.observe(document.body, { attributes: true, attributeFilter: ["class"] });

        // ============================================================
        //  applicationCache gate
        // ============================================================
        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
          loadJb();
          return;
        }
        if (!navigator.onLine) {
          setCache("offline -- from cache", true);
          loadJb();
          return;
        }
        if (ac.status === ac.IDLE) {
          setCache("cached", true);
          loadJb();
          return;
        }
        if (ac.status === ac.UPDATEREADY) {
          try { ac.swapCache(); } catch (e) {}
          setCache("update downloaded (continuing)", true);
          loadJb();
          return;
        }

        setCache("checking cache...");

        ac.addEventListener("downloading", function () {
          setCache("caching for offline (first run)...");
        }, false);
        ac.addEventListener("progress", function (e) {
          if (e && e.total)
            setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
          setCache("cached for offline use", true);
          loadJb();
        }, false);
        ac.addEventListener("updateready", function () {
          try { ac.swapCache(); } catch (e) {}
          setCache("update downloaded (continuing)", true);
          loadJb();
        }, false);
        ac.addEventListener("noupdate", function () {
          setCache("cached -- offline ready", true);
          loadJb();
        }, false);
        ac.addEventListener("error", function () {
          setCache("cache unavailable");
          loadJb();
        }, false);
        ac.addEventListener("obsolete", function () {
          setCache("cache obsolete");
          loadJb();
        }, false);
      })();
    </script>
  </body>
</html>
