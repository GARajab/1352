<!doctype html>
<html lang="en" manifest="cache.appcache">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rajab PS4 13.xx Jailbreak</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0b0d10;
            color: #c8ced8;
            font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }

        /* ---------- unsupported chip (top-left) ---------- */
        #fwchip {
            position: fixed;
            top: 14px;
            left: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #1a0f10;
            border: 1px solid #5c2a2a;
            border-left: 4px solid #d08a7f;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .55);
            z-index: 10;
            max-width: 60vw;
        }

        #fwchip.on {
            display: flex;
        }

        #fwchip .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d08a7f;
            box-shadow: 0 0 10px #d08a7f;
            flex: 0 0 auto;
        }

        #fwchip .txt {
            line-height: 1.25;
        }

        #fwchip .txt .t1 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .12em;
            color: #f0c0b6;
        }

        #fwchip .txt .t2 {
            font-size: 11px;
            color: #a07a72;
            margin-top: 2px;
        }

        /* ---------- stage (ring + image + number) ---------- */
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding-bottom: 6vmin;
            /* nudges the stack up a touch */
        }

        #stage h1 {
            /* font-size: clamp(16px, 3.2vmin, 30px); */
            font-weight: 700;
            /* letter-spacing: .12em; */
            margin: 10 0 0 10;
            color: #eff4f1;
        }

        #ringwrap {
            position: relative;
            width: min(78vmin, 620px);
            height: min(78vmin, 620px);
        }

        /* the SVG ring sits behind the image */
        #ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            /* start at 12 o'clock */
            pointer-events: none;
        }

        #ring .track {
            fill: none;
            stroke: #1b2029;
            stroke-width: 10;
        }

        #ring .fill {
            fill: none;
            stroke: url(#ringgrad);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset .35s ease-out, stroke .3s;
        }

        #ring.fail .fill {
            stroke: #d08a7f;
        }

        #ring.done .fill {
            stroke: #7fd0a0;
        }

        /* the logo image sits inside the ring */
        #logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 62%;
            height: 62%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            border-radius: 50%;
            transition: opacity .3s;
            opacity: 1;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* while loading: dim so the percentage is readable */
        body.running #logo {
            opacity: .35;
        }

        body.done #logo {
            opacity: 1;
        }

        body.fail #logo {
            opacity: .45;
        }

        /* ---------- big percentage, BELOW the ring ---------- */
        #pct {
            margin-top: 18px;
            font-size: clamp(56px, 14vmin, 150px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #e6ebf2;
            text-shadow: 0 2px 18px rgba(0, 0, 0, .75);
            line-height: 1;
            transition: opacity .35s;
        }

        #pct .unit {
            font-size: .38em;
            font-weight: 600;
            margin-left: .08em;
            color: #9fb3d0;
        }

        body.done #pct {
            opacity: 0;
        }

        /* ---------- final status, further below the percentage ---------- */
        #final {
            margin-top: 6px;
            text-align: center;
            font-size: clamp(16px, 3.2vmin, 30px);
            font-weight: 700;
            letter-spacing: .12em;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .4s .15s, transform .4s .15s;
            pointer-events: none;
        }

        body.done #final,
        body.fail #final {
            opacity: 1;
            transform: translateY(0);
        }

        body.done #final {
            color: #7fd0a0;
        }

        body.fail #final {
            color: #d08a7f;
        }

        /* ---------- hidden jb.js compatibility nodes ---------- */
        #wrap {
            display: none;
        }

        #state,
        #out {
            display: none;
        }

        #spin {
            display: none;
        }

        #msg {
            display: none;
        }

        /* ---------- ?log=1 overrides ---------- */
        body.log #stage {
            display: none;
        }

        body.log #fwchip {
            display: none;
        }

        body.log #wrap {
            display: block;
            padding: 14px 18px;
        }

        body.log #state {
            display: block;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        body.log #out {
            display: block;
            white-space: pre-wrap;
            font: 12px/1.45 Consolas, monospace;
            background: #11151b;
            border: 1px solid #1e2732;
            border-radius: 5px;
            padding: 10px 12px;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }

        .ok {
            color: #7fd0a0;
        }

        .bad {
            color: #d08a7f;
        }

        .warn {
            color: #d8c07f;
        }
    </style>
</head>

<body>
    <!-- unsupported firmware chip (top-left) -->
    <div id="fwchip">
        <div class="dot"></div>
        <div class="txt">
            <div class="t1">UNSUPPORTED FIRMWARE</div>
            <div class="t2" id="fwver">firmware unknown</div>
        </div>
    </div>

    <!-- main visual stage -->
    <div id="stage">
        <h1>Rajab PS4 13.xx Jailbreak</h1>
        <h4>Thanks To Raw Game And SiSTRo</h4>
        <h1>GoldHen Latest Version 12.4b18.12 released date 21/09/2026</h1>
        <div id="ringwrap">
            <svg id="ring" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#4fa3d8" />
                        <stop offset="55%" stop-color="#8a6ff0" />
                        <stop offset="100%" stop-color="#7fd0a0" />
                    </linearGradient>
                </defs>
                <circle class="track" cx="100" cy="100" r="88" />
                <circle class="fill" cx="100" cy="100" r="88" />
            </svg>
            <img id="logo" src="rajab-logo.jpg" alt="">
        </div>
        <div id="pct">0<span class="unit">%</span></div>
        <div id="final"></div>
    </div>

    <!-- jb.js compatibility nodes (kept, hidden unless ?log=1) -->
    <div id="spin"></div>
    <div id="msg"></div>
    <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
    </div>

    <script>
        (function () {
            "use strict";

            var fwChip = document.getElementById("fwchip");
            var fwVer = document.getElementById("fwver");
            var ringSvg = document.getElementById("ring");
            var ringFill = ringSvg.querySelector(".fill");
            var pctEl = document.getElementById("pct");
            var finalEl = document.getElementById("final");
            var logoEl = document.getElementById("logo");

            // ------- SVG ring geometry -------
            var R = 88;
            var CIRC = 2 * Math.PI * R;
            ringFill.style.strokeDasharray = CIRC + " " + CIRC;
            ringFill.style.strokeDashoffset = CIRC;   // start empty

            // ------- firmware detection -------
            // KEEP IN SYNC with ps4_offsets.js.
            // PS4 reports its minor as two hex digits in the UA (13.52 -> 0x52).
            var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

            var key = null, fwnum = null;
            var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
            if (m) {
                var ms = parseInt(m[2], 16).toString(16);
                if (ms.length < 2) ms = "0" + ms;
                key = m[1] + "." + ms;
                fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
            }

            console.log("has manifest attr:", document.documentElement.hasAttribute("manifest"));
            console.log("has applicationCache:", !!window.applicationCache);
            console.log("status:", window.applicationCache && window.applicationCache.status);
            // status codes: 0=UNCACHED 1=IDLE 2=CHECKING 3=DOWNLOADING 4=UPDATEREADY 5=OBSOLETE

            var supported = (fwnum !== null && SUPPORTED[fwnum] === 1);

            // ------- percentage setter -------
            var currentPct = 0;
            function setPct(p) {
                if (p <= currentPct) return;
                currentPct = p;
                pctEl.firstChild.nodeValue = String(p);
                ringFill.style.strokeDashoffset = CIRC * (1 - p / 100);
            }

            // ------- milestone map (same tags as before) -------
            var PCT = {
                "PRIMITIVE-OK": 10,
                "BASES": 15,
                "STUBS": 20,
                "PROOF-OK": 25,
                "pr-two-workers-reach-kernel": 30,
                "MAIN-PINNED": 35,
                "PIN-SPLIT": 35,
                "PR-PASSA": 45,
                "PR-PASSB": 55,
                "ANCHOR-VERDICT": 65,
                "KF-UNHIDE-LANDED": 70,
                "KRW-VERDICT": 80,
                "JB-ROOT-AND-ESCAPE": 88,
                "KERNEL-PATCHED": 94,
                "PAYLOAD-RUN": 99
            };

            // ============================================================
            //  unsupported firmware -> dead end, chip top-left, no jb
            // ============================================================
            if (!supported) {
                fwVer.textContent = "firmware " + (key || "unknown");
                fwChip.classList.add("on");
                return;
            }

            // ============================================================
            //  load jb.js (same gating as before, no visible text)
            // ============================================================
            var jbLoaded = false;
            function loadJb() {
                if (jbLoaded) return;
                jbLoaded = true;
                document.body.classList.add("running");

                window.addEventListener("jbmark", function (e) {
                    try {
                        var t = e && e.detail && e.detail.tag;
                        if (t && PCT[t] !== undefined) setPct(PCT[t]);
                    } catch (_) { }
                }, false);

                window.addEventListener("jbdone", function () {
                    setPct(100);
                    ringSvg.classList.add("done");
                    document.body.classList.remove("running");
                    document.body.classList.add("done");
                    finalEl.textContent = "Done Jailbreak Success and GoldHen Loaded Successfully";
                }, false);

                var s = document.createElement("script");
                s.type = "module";
                s.src = "jb.js?v=10";
                document.body.appendChild(s);
            }

            // watch body.className for the fail path from finishUI()
            var bodyObs = new MutationObserver(function () {
                var c = document.body.className;
                if (c.indexOf("done") >= 0) return;   // success already handled
                if (c.indexOf("fail") >= 0) {
                    ringSvg.classList.add("fail");
                    document.body.classList.remove("running");
                    finalEl.textContent = "REBOOT YOUR CONSOLE AND TRY AGAIN";
                }
            });
            bodyObs.observe(document.body, { attributes: true, attributeFilter: ["class"] });

            // ============================================================
            //  applicationCache gate (unchanged, silent)
            // ============================================================
            var ac = window.applicationCache;
            if (!ac || !document.documentElement.hasAttribute("manifest")) {
                loadJb(); return;
            }
            if (!navigator.onLine) { loadJb(); return; }
            if (ac.status === ac.IDLE) { loadJb(); return; }
            if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) { }
                loadJb(); return;
            }
            ac.addEventListener("cached", function () { loadJb(); }, false);
            ac.addEventListener("noupdate", function () { loadJb(); }, false);
            ac.addEventListener("updateready", function () {
                try { ac.swapCache(); } catch (e) { }
                loadJb();
            }, false);
            ac.addEventListener("error", function () { loadJb(); }, false);
            ac.addEventListener("obsolete", function () { loadJb(); }, false);

            // if the browser never fires cached/noupdate (rare), fall back
            setTimeout(function () { if (!jbLoaded) loadJb(); }, 4000);
        })();

    </script>
</body>

</html>
